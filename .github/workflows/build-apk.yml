name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            autopoint \
            gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-build.txt

      - name: Verify Build Configuration
        run: |
          echo "========== buildozer.spec =========="
          cat buildozer.spec
          echo "===================================="
          buildozer --version

      - name: Remove previous Android build state
        run: |
          rm -rf .buildozer

      - name: Build Android APK
        env:
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        run: |
          buildozer android debug

      - name: Show APK files
        if: success()
        run: |
          echo "========== APK OUTPUT =========="
          find bin -type f -name "*.apk" -print
          echo "================================"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Image-Sizer-Android-APK
          path: bin/*.apk
          if-no-files-found: error
